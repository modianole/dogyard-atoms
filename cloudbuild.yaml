steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg PUBLIC_SUPABASE_URL=$$SUPABASE_URL \
          --build-arg PUBLIC_SUPABASE_ANON_KEY=$$SUPABASE_KEY \
          --build-arg PUBLIC_GOOGLE_MAPS_API_KEY=$$GOOGLE_MAPS_KEY \
          -t gcr.io/$PROJECT_ID/dogyard-atoms .
    secretEnv: ['SUPABASE_URL', 'SUPABASE_KEY', 'GOOGLE_MAPS_KEY']

images:
  - 'gcr.io/$PROJECT_ID/dogyard-atoms'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_URL/versions/latest
      env: 'SUPABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_KEY/versions/latest
      env: 'SUPABASE_KEY'
    - versionName: projects/$PROJECT_ID/secrets/GOOGLE_MAPS_API_KEY/versions/latest
      env: 'GOOGLE_MAPS_KEY'
