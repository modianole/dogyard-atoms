# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "app".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  app:
    image: dogyard-atoms:local
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,uid=10001,gid=10001,mode=1777
      - /var/cache/nginx:rw,uid=10001,gid=10001,mode=0755
      - /var/run:rw,uid=10001,gid=10001,mode=0755
      - /var/run/nginx:rw,uid=10001,gid=10001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: .
      target: final
      args:
        PUBLIC_SUPABASE_URL: ${VITE_SUPABASE_URL}
        PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        PUBLIC_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        PUBLIC_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        PUBLIC_ADMIN_USER_ID: ${VITE_ADMIN_USER_ID}
        PUBLIC_ADMIN_EMAIL: ${VITE_ADMIN_EMAIL}
    ports:
      - "8082:80"
    restart: unless-stopped