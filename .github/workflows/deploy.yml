# Build → Scan → Push → Deploy
# Triggers on every push to main.
# Required GitHub Actions secrets:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_ANON_KEY
#   VITE_GOOGLE_MAPS_API_KEY
#   VITE_ADMIN_USER_ID, VITE_ADMIN_EMAIL   (optional; admin UI disabled if absent)
#   KUBECONFIG                             (base64-encoded kubeconfig for the production cluster)
# GITHUB_TOKEN is auto-provided by Actions (used for GHCR push + SARIF upload).

name: Build · Scan · Push · Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write          # push to GHCR
  security-events: write   # upload Trivy SARIF

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dogyard-atoms

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build, push, scan
  # ──────────────────────────────────────────────────────────────────────────
  build-and-scan:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            PUBLIC_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            PUBLIC_ADMIN_USER_ID=${{ secrets.VITE_ADMIN_USER_ID }}
            PUBLIC_ADMIN_EMAIL=${{ secrets.VITE_ADMIN_EMAIL }}

      - name: Scan image with Trivy (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Deploy to production cluster
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: production   # requires manual approval gate (configure in repo Settings)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Patch production overlay with exact image digest
        working-directory: bridge/overlays/production
        run: |
          kustomize edit set image \
            dogyard-atoms:local=${{ env.IMAGE_NAME }}@${{ needs.build-and-scan.outputs.digest }}

      - name: Apply production overlay
        run: kubectl apply -k bridge/overlays/production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/app \
            -n dogyard-atoms \
            --timeout=180s
