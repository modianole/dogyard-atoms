// Top-level build file
buildscript {
    // טעינת המשתנים מתיקיית android
    apply from: "android/variables.gradle"
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24" // גרסה יציבה יותר
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // הפיכת המשתנים לזמינים לכל תתי-הפרויקטים
    if (file("android/variables.gradle").exists()) {
        apply from: "${rootProject.projectDir}/android/variables.gradle"
    }
}
