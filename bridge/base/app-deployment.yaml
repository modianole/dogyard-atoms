apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: dogyard-atoms
  labels:
    app.kubernetes.io/name: dogyard-atoms
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dogyard-atoms
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dogyard-atoms
        app.kubernetes.io/component: frontend
    spec:
      # restartPolicy for Deployment pods must be Always (the default).
      # "unless-stopped" is a Docker Compose concept and is invalid here.
      restartPolicy: Always
      securityContext:
        runAsNonRoot: false  # nginx needs root to bind port 80
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: dogyard-atoms:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE  # required to bind port 80
            readOnlyRootFilesystem: false  # nginx writes to /var/cache/nginx and /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
