apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-network-policy
  namespace: dogyard-atoms
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dogyard-atoms
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from anywhere (public web application).
    - ports:
        - port: 8082
          protocol: TCP
  egress:
    # Allow DNS resolution (required by the container runtime / glibc).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
