server {
    listen ${PORT};
    server_name _;

    set $redirect_to_https 0;

    if ($http_x_forwarded_proto = "http") {
        set $redirect_to_https 1;
    }

    # Read env-substituted flag into a variable before comparing in `if`.
    set $force_https "${FORCE_HTTPS}";

    if ($force_https = "true") {
        set $redirect_to_https 1;
    }

    if ($redirect_to_https = 1) {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for common static assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache immutable Vite assets aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri /index.html;
    }

    # Do not cache SPA shell; this prevents stale deployments from sticky index.html.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # SPA fallback for BrowserRouter deep links.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }

    # === Security Headers ===
    # Prevent clickjacking and embedding
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME sniffing and force declared content types
    add_header X-Content-Type-Options "nosniff" always;
    # Browser XSS filter (deprecated but still useful for older browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    # Control source of referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: force HTTPS for 1 year + subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Restrict permissions for sensitive APIs
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    # Control cross-origin resource sharing
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Prevent cross-origin window opening
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Content Security Policy - strict but allowing Google Maps
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://maps.googleapis.com https://places.googleapis.com; frame-src 'none'; object-src 'none';" always;
    # Disable client caching of sensitive responses
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
